onboarding = false
[experimental]
kitty_graphics = true

[theme]
name = "gruvbox"
auto_switch = false
light_name = "catppuccin-latte"
dark_name = "catppuccin"
[session]
resume_agents_on_restore = true
[keys]
prefix = "ctrl+b"
goto = "prefix+g"
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
new_tab = "alt+shift+t"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
close_tab = "alt+shift+x"
switch_tab = "prefix+1..9"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
close_pane = "alt+w"
zoom = "alt+shift+z"
new_workspace = "alt+shift+n"
previous_workspace = "prefix+j"
next_workspace = "prefix+k"
previous_agent = "prefix+h"
next_agent = "prefix+l"
[[keys.command]]
key = "prefix+shift+e"
type = "popup"
command = "hx"
description = "run helix editor"
width = "80%"
height = "80%"
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"
[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"
[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "linuxing3.termscope.open"
description = "visible-screen file picker"
[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "linuxing3.termscope.open-links"
description = "visible-screen link picker"
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer in split"
[[keys.command]]
key = "prefix+shift+y"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer in tab"
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "efwmc.file-explorer.open"
description = "open nnn file explorer in split"
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "efwmc.file-explorer.open-tab"
description = "open nnn file explorer in tab"
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "linuxing3.herdr-hx.toggle"
description = "toggle hx sidebar"
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "ramarivera.palette.open"
description = "open Herdr command palette"
[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "crabbox.boxes"
description = "Crabbox boxes"
[[keys.command]]
key = "prefix+shift+j"
type = "plugin_action"
command = "crabbox.run-job"
description = "Run a Crabbox job"
[[keys.command]]
key = "prefix+up"
type = "plugin_action"
command = "cloudmanic.herdr-plus.projects"
description = "herdr-plus: projects"
[[keys.command]]
key = "prefix+down"
type = "plugin_action"
command = "cloudmanic.herdr-plus.quick-actions"
description = "herdr-plus: quick actions"
[[keys.command]]
key = "prefix+i"
type = "shell"
command = '"${HERDR_BIN_PATH}" plugin pane open --plugin official.browser --entrypoint browser --placement split --direction right --focus'
description = "open browser in right split"
[[keys.command]]
key = "prefix+shift+i"
type = "shell"
command = '"${HERDR_BIN_PATH}" plugin pane open --plugin official.browser --entrypoint browser --placement overlay --focus'
description = "open browser overlay"
[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = '"${HERDR_BIN_PATH}"  plugin action invoke herdr-sidebar.open-sidebar'
description = "open browser overlay"

[ui]
show_agent_labels_on_pane_borders = true
