set  -g default-terminal "xterm-256color"
set  -g base-index      1
setw -g pane-base-index 1

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g status-keys vi
set -g mode-keys   vi

set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     2000

# set-option -g status off
set-option -g default-command "zsh"
set-option -g lock-after-time 1800

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# BINDING TWEAKS
 
# using C-space as prefix
set-option -g prefix C-space
unbind-key C-b
bind-key C-Space send-prefix

# toggle status
bind-key b set-option status

# reload config
bind-key -n M-r source-file ~/.config/tmux/tmux.conf \; \
       display-message "source-file done"

# run a command in new window 
bind-key Space command-prompt "new-window -n %1 'exec %1'"

# run man 
bind-key / command-prompt "split-window 'exec man %%'"
# run ssh
bind-key S command-prompt "new-window -n %1 'ssh %1'"

# open window
bind-key -n M-n new-window

# open editor
bind-key -n M-e new-window hx

# open filer
bind-key -n M-m new-window nnn

# split window
bind-key '|' split-window -h
bind-key '-' split-window
bind-key -n M-v split-window -h
bind-key -n M-V split-window

# switch window
bind-key -n M-H previous-window
bind-key -n M-L next-window

# close pane
bind-key -n M-w kill-pane

# switch pane
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# toggle pane fullscreen 
bind-key -n M-f resize-pane -Z

# COPY TWEAKS
# enter copy mode
bind-key -n M-[ copy-mode

# begin selection
bind-key -T copy-mode-vi v send-keys -X begin-selection

# copy selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# copy line
bind-key -T copy-mode-vi x send-keys -X select-line

# paste in copy mode
bind-key -n M-] paste-buffer -p

# loading private configure
source-file ~/.config/tmux/private.conf 
